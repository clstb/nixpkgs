skip_clone: true
steps:
  sync-upstream:
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - git clone --filter=blob:none https://github.com/clstb/nixpkgs.git .
      - git config --global user.email "claas.stoertenbecker@gmail.com"
      - git config --global user.name "clstb"
      - git remote add upstream https://github.com/NixOS/nixpkgs.git
      - git fetch upstream master --depth 2000 --no-tags
      - git checkout master
      - git rebase upstream/master
      - git push https://$GITHUB_TOKEN@github.com/clstb/nixpkgs.git master --force-with-lease
    when:
      event: cron
      cron: nightly
